spring:
  application:
    name: jdbcodata
  main:
    banner-mode: off
  datasource:
    # Metadata DB. Default: embedded H2 file in ./data. Override with JDBCODATA_META_* or spring.datasource.*
    url: ${jdbcodata.meta.url:jdbc:h2:file:./data/jdbcodata;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${jdbcodata.meta.username:sa}
    password: ${jdbcodata.meta.password:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

jdbcodata:
  admin:
    user: admin
    password: ""          # empty: a random password is generated and logged at startup
  odata:
    max-rows: 500000       # hard upper bound per result
    default-timeout-sec: 60
  seed:
    file: ""               # YAML file with datasources and queries, e.g. config/seed.yml
  master-key: ""           # Base64, 32 bytes (AES-256). Empty: a key file is created in <data-dir>/master.key
  data-dir: ./data
  cache:
    max-size-mb: 1024      # persistent cache, total compressed size
    memory-mb: 256         # in-memory layer (Caffeine)
    cleanup-interval-ms: 300000
  stats:
    retention-days: 90     # execution log retention
    async: true            # write execution log records off the request thread

logging:
  level:
    at.jdbcodata: INFO
    com.zaxxer.hikari: WARN
