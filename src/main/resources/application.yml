spring:
  application:
    name: jdbcodata
  main:
    banner-mode: off
  datasource:
    # Metadata DB. Default: embedded H2 file in ./data. Override with JDBCODATA_META_* or spring.datasource.*
    url: ${jdbcodata.meta.url:jdbc:h2:file:./data/jdbcodata;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${jdbcodata.meta.username:sa}
    password: ${jdbcodata.meta.password:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: en             # admin UI is English only (validation messages, date formats)
    locale-resolver: fixed

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax     # Secure is set by Tomcat for HTTPS requests (directly or via X-Forwarded-Proto, strategy native)

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

jdbcodata:
  admin:
    user: admin
    password: ""          # empty: a random password is written to <data-dir>/initial-admin-password
  odata:
    max-rows: 100000       # hard upper bound per result; results are held in memory, raise it together with the heap
    default-timeout-sec: 60
    concurrency-wait-ms: 2000   # wait for a free execution slot of a datasource before answering 503
    anonymous-user: ""          # service user for requests without Basic credentials (public demo); empty = off
    page-size: 0                # server-driven paging: rows per page before @odata.nextLink; 0 = off
  seed:
    file: ""               # YAML file with datasources and queries, e.g. config/seed.yml
  master-key: ""           # Base64, 32 bytes (AES-256). Empty: a key file is created in <data-dir>/master.key
  data-dir: ./data
  cache:
    max-size-mb: 1024      # persistent cache, total compressed size
    memory-mb: 256         # in-memory layer (Caffeine)
    cleanup-interval-ms: 300000
  stats:
    retention-days: 90     # execution log retention
    async: true            # write execution log records off the request thread
  audit:
    retention-days: 0      # audit log retention; 0 = keep everything
  usage:
    db-url: ""             # usage statistics of a public instance (PostgreSQL); empty = off, nothing is recorded or sent
    db-user: ""
    db-password: ""
    hash-secret: ""        # required with db-url, keys the daily salt of the visitor hash
  health:
    interval-ms: 60000     # active check of datasources with a technical account (admin UI status); 0 = off
  ui:
    environment: ""        # label of this deployment in the admin top bar, e.g. DEV, TEST, PROD; empty = no badge
  security:
    allow-plain-http: false   # true only behind a TLS reverse proxy or for local demos (Basic Auth needs TLS)
    rate-limit-per-minute: 20 # failed logins per IP before 429 (per username: 5x)
    allowed-jdbc-urls: []     # extra JDBC URL prefixes for drivers in lib/, e.g. jdbc:sqlserver:
    allow-embedded-h2: false  # in-process H2 as datasource: local demo and tests only

logging:
  pattern:
    correlation: "[%X{requestId:-}] "   # request ID in text logs; logging.structured.format.console=ecs adds it to JSON
  level:
    at.jdbcodata: INFO
    com.zaxxer.hikari: WARN
