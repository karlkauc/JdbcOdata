# Demo profile: creates a local H2 database with sample data (user demo / password demo)
# and seeds one datasource and one query so the feed is immediately visible in Excel.
server:
  address: 127.0.0.1         # plain HTTP and a sample database: this machine only
jdbcodata:
  security:
    allow-plain-http: true   # local demo without TLS
    allow-embedded-h2: true  # the demo database is an H2 file; never in production (runs inside the JVM)
  demo:
    jdbc-url: jdbc:h2:file:./data/demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
  seed:
    file: classpath:seed-demo.yml
