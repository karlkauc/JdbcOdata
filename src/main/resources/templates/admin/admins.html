<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Admin accounts', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div><h1>Admin accounts</h1><p class="lead">ADMIN may do everything, VIEWER may only read and see statistics. At least one enabled ADMIN must remain.</p></div>
  </div>
  <table class="list">
    <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Change</th><th></th></tr></thead>
    <tbody>
    <tr th:each="a : ${admins}">
      <td><strong th:text="${a.username}"></strong></td>
      <td><span class="badge plain" th:text="${a.role}"></span></td>
      <td><span th:class="${a.enabled} ? 'badge ok' : 'badge off'" th:text="${a.enabled} ? 'enabled' : 'disabled'"></span>
        <span class="badge plain" th:if="${a.mustChangePassword}">temporary password</span></td>
      <td th:text="${a.lastLoginAt != null} ? ${#temporals.format(a.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '–'"></td>
      <td><form th:action="@{/admin/admins/{id}(id=${a.id})}" method="post" class="inline-form" style="margin:0">
        <select name="role" style="width:auto"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == a.role}"></option></select>
        <label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${a.enabled}"> enabled</label>
        <input type="password" name="password" placeholder="new password" autocomplete="new-password" style="width:160px">
        <button type="submit" class="small">Save</button></form></td>
      <td><form th:action="@{/admin/admins/{id}/delete(id=${a.id})}" method="post" data-confirm="Delete this account?"><button type="submit" class="small">Delete</button></form></td>
    </tr>
    </tbody>
  </table>
  <h2>New account</h2>
  <form th:action="@{/admin/admins}" method="post" class="card inline-form">
    <label>User <input type="text" name="username" required autocomplete="off"></label>
    <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Role <select name="role"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></label>
    <button type="submit" class="primary">Create account</button>
  </form>
</main>
</body>
</html>
