<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Admin-Konten', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div><h1>Admin-Konten</h1><p class="lead">ADMIN darf alles, VIEWER nur lesen und Statistiken sehen. Mindestens ein aktiver ADMIN muss bestehen bleiben.</p></div>
  </div>
  <table class="list">
    <thead><tr><th>Benutzer</th><th>Rolle</th><th>Status</th><th>Letzter Login</th><th>Ändern</th><th></th></tr></thead>
    <tbody>
    <tr th:each="a : ${admins}">
      <td><strong th:text="${a.username}"></strong></td>
      <td><span class="badge plain" th:text="${a.role}"></span></td>
      <td><span th:class="${a.enabled} ? 'badge ok' : 'badge off'" th:text="${a.enabled} ? 'aktiv' : 'inaktiv'"></span></td>
      <td th:text="${a.lastLoginAt != null} ? ${#temporals.format(a.lastLoginAt, 'dd.MM.yyyy HH:mm')} : '–'"></td>
      <td><form th:action="@{/admin/admins/{id}(id=${a.id})}" method="post" class="inline-form" style="margin:0">
        <select name="role" style="width:auto"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == a.role}"></option></select>
        <label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${a.enabled}"> aktiv</label>
        <input type="password" name="password" placeholder="neues Passwort" autocomplete="new-password" style="width:160px">
        <button type="submit" class="small">Speichern</button></form></td>
      <td><form th:action="@{/admin/admins/{id}/delete(id=${a.id})}" method="post" onsubmit="return confirm('Konto löschen?')"><button type="submit" class="small">Löschen</button></form></td>
    </tr>
    </tbody>
  </table>
  <h2>Neues Konto</h2>
  <form th:action="@{/admin/admins}" method="post" class="card inline-form">
    <label>Benutzer <input type="text" name="username" required autocomplete="off"></label>
    <label>Passwort <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Rolle <select name="role"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></label>
    <button type="submit" class="primary">Konto anlegen</button>
  </form>
</main>
</body>
</html>
