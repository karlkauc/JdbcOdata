<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${datasource == null} ? 'New datasource' : ${datasource.name}, ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div>
      <h1 th:text="${datasource == null} ? 'New datasource' : ${datasource.name}">Datasource</h1>
      <p class="lead" th:if="${datasource != null}" th:text="${datasource.description}"></p>
    </div>
    <form th:if="${datasource != null}" th:action="@{/admin/datasources/{id}/delete(id=${datasource.id})}" method="post"
          data-confirm="Really delete this datasource?">
      <button type="submit" class="danger">Delete</button>
    </form>
  </div>

  <form id="ds-form" th:object="${form}" th:action="${datasource == null} ? @{/admin/datasources} : @{/admin/datasources/{id}(id=${datasource.id})}" method="post" class="card">
    <h2>Connection</h2>
    <div class="grid2">
      <label>Name <input type="text" th:field="*{name}" required>
        <span class="field-error" th:errors="*{name}"></span></label>
      <label>Description <input type="text" th:field="*{description}"></label>
      <label class="span2">JDBC URL <input type="text" th:field="*{jdbcUrl}" class="mono" required placeholder="jdbc:postgresql://host:5432/db">
        <span class="field-error" th:errors="*{jdbcUrl}"></span></label>
      <label>Driver class <input type="text" th:field="*{driverClass}" class="mono" placeholder="optional, e.g. oracle.jdbc.OracleDriver">
        <small>Leave empty if the driver is detected from the URL.</small></label>
      <label>Time zone <input type="text" th:field="*{timezone}" placeholder="e.g. Europe/Vienna">
        <small>For DATE/TIMESTAMP without time zone.</small></label>
    </div>
    <h2>Session</h2>
    <div class="grid2">
      <label>Session settings
        <textarea th:field="*{sessionSettings}" rows="4" class="mono" placeholder="NLS_SORT=GERMAN&#10;NLS_DATE_FORMAT=DD.MM.YYYY"></textarea>
        <small>One KEY=VALUE per line, applied after connecting (e.g. ALTER SESSION on Oracle). Queries can override single keys.
          <span th:if="${!#strings.isEmpty(form.allowedSessionKeys)}">Allowed: <span class="mono" th:text="${form.allowedSessionKeys}"></span></span></small></label>
      <label>JDBC driver properties
        <textarea th:field="*{driverProperties}" rows="4" class="mono" placeholder="oracle.jdbc.defaultNChar=true"></textarea>
        <small>One KEY=VALUE per line, passed to the driver like URL options. No credentials.</small></label>
    </div>
    <h2>Limits</h2>
    <div class="grid3">
      <label>Default timeout (s) <input type="number" th:field="*{defaultTimeoutSec}" min="1" max="3600">
        <span class="field-error" th:errors="*{defaultTimeoutSec}"></span></label>
      <label>Max. rows <input type="number" th:field="*{maxRows}" min="1">
        <span class="field-error" th:errors="*{maxRows}"></span></label>
      <label>Max. parallel executions <input type="number" th:field="*{maxConcurrent}" min="1" max="1000">
        <small>Beyond that the service answers 503 with Retry-After.</small></label>
    </div>
    <label class="check"><input type="checkbox" th:field="*{enabled}"> Datasource enabled</label>
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <a class="button" th:href="@{/admin/datasources}">Back</a>
    </div>
  </form>

  <section class="card" th:if="${datasource != null}">
    <h2>Test connection</h2>
    <p class="muted">The credentials are only used for this test and are not stored.</p>
    <form class="inline-form" th:attr="hx-post=@{/admin/datasources/{id}/test(id=${datasource.id})}" hx-target="#test-result" hx-swap="innerHTML">
      <label>DB user <input type="text" name="dbUser" required autocomplete="off"></label>
      <label>Password <input type="password" name="dbPassword" autocomplete="off"></label>
      <button type="submit">Test</button>
    </form>
    <div id="test-result"></div>
  </section>
</main>
</body>
</html>
