<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Change password', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div><h1>Change password</h1><p class="lead" th:text="${required} ? 'Your password was set by someone else. Choose your own to continue.' : 'Other sessions of your account will be signed out.'"></p></div>
  </div>
  <form th:action="@{/admin/password}" method="post" class="card inline-form">
    <label>Current password <input type="password" name="current" required autofocus autocomplete="current-password"></label>
    <label>New password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Repeat new password <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <button type="submit" class="primary">Change password</button>
  </form>
</main>
</body>
</html>
