<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Technische Accounts', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div><h1>Technische Accounts</h1><p class="lead">DB-Konten, unter denen Queries im Modus FIXED laufen. Passwörter werden verschlüsselt gespeichert.</p></div>
    <a class="button primary" th:href="@{/admin/accounts/new}">Neuer Account</a>
  </div>
  <table class="list">
    <thead><tr><th>Name</th><th>Datenquelle</th><th>DB-User</th><th>Geändert</th></tr></thead>
    <tbody>
    <tr th:each="a : ${accounts}">
      <td><a th:href="@{/admin/accounts/{id}(id=${a.id})}" th:text="${a.name}"></a><div class="muted" th:text="${a.description}"></div></td>
      <td th:text="${a.datasourceName}"></td>
      <td class="mono" th:text="${a.dbUsername}"></td>
      <td th:text="${#temporals.format(a.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
    </tr>
    <tr th:if="${accounts.isEmpty()}"><td colspan="4" class="empty">Noch keine technischen Accounts. <a th:href="@{/admin/accounts/new}">Ersten Account anlegen</a>.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
