<div xmlns:th="http://www.thymeleaf.org">
  <div class="flash err" th:if="${error}" th:text="${error}"></div>
  <th:block th:if="${result != null}">
    <div class="flash ok">
      <span th:text="${result.rows.size()}"></span> row(s) in <span th:text="${result.durationMs}"></span> ms,
      <span th:text="${result.columns.size()}"></span> columns.
      <span th:if="${result.truncated}">Preview limited to the first rows.</span>
    </div>
    <div class="scroll">
      <table class="list preview">
        <thead><tr><th th:each="c : ${result.columns}"><span th:text="${c.propertyName}"></span><small th:text="${c.edmType}"></small></th></tr></thead>
        <tbody>
        <tr th:each="row : ${result.rows}">
          <td th:each="c : ${result.columns}" th:text="${row[c.propertyName]}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </th:block>
</div>
