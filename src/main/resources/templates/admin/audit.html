<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Audit log', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <div><h1>Audit log</h1><p class="lead">Configuration changes, sign-ins and query test runs. Secrets are never logged.</p></div>
  </div>
  <table class="list">
    <thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Type</th><th>Object</th><th>Details</th></tr></thead>
    <tbody>
    <tr th:each="e : ${entries}">
      <td style="white-space:nowrap" th:text="${#temporals.format(e.occurredAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
      <td th:text="${e.adminUser}"></td>
      <td><span class="badge plain" th:text="${e.action}"></span></td>
      <td th:text="${e.entityType}"></td>
      <td th:text="${e.entityName}"></td>
      <td class="mono muted" th:text="${e.details}"></td>
    </tr>
    <tr th:if="${entries.isEmpty()}"><td colspan="6" class="empty">No entries yet.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
