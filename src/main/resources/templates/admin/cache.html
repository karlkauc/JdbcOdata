<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Cache', ~{:: main})}">
<body>
<main>
  <div class="page-head">
    <h1>Ergebnis-Cache</h1>
    <form th:action="@{/admin/cache/invalidate}" method="post" onsubmit="return confirm('Gesamten Cache leeren?')"><button type="submit" class="danger">Alles invalidieren</button></form>
  </div>
  <div class="tiles">
    <div class="tile"><span class="num" th:text="${stats.entries}">0</span>Einträge (persistent)</div>
    <div class="tile"><span class="num" th:text="${#numbers.formatDecimal(stats.bytes / 1048576.0, 1, 1)} + ' MB'">0</span>Größe (von <span th:text="${stats.maxBytes / 1048576}"></span> MB)</div>
    <div class="tile"><span class="num" th:text="${stats.memoryEntries}">0</span>Einträge im Speicher</div>
  </div>
  <table class="list">
    <thead><tr><th>Query</th><th>Version</th><th>DB-User</th><th>Parameter</th><th>Zeilen</th><th>Größe</th><th>Erstellt</th><th>Läuft ab</th><th>Zugriff</th><th></th></tr></thead>
    <tbody>
    <tr th:each="e : ${entries}">
      <td th:text="${e.queryName}"></td>
      <td th:text="${e.queryVersion}"></td>
      <td class="mono" th:text="${e.dbUser}"></td>
      <td class="mono" th:text="${e.params}"></td>
      <td th:text="${e.rowCount}"></td>
      <td th:text="${#numbers.formatDecimal(e.byteSize / 1024.0, 1, 1)} + ' KB'"></td>
      <td th:text="${#temporals.format(e.createdAt, 'dd.MM. HH:mm:ss')}"></td>
      <td th:text="${#temporals.format(e.expiresAt, 'dd.MM. HH:mm:ss')}"></td>
      <td th:text="${#temporals.format(e.lastAccessAt, 'dd.MM. HH:mm:ss')}"></td>
      <td><form th:action="@{/admin/cache/invalidate}" method="post">
        <input type="hidden" name="queryId" th:value="${e.queryId}"><input type="hidden" name="dbUser" th:value="${e.dbUser}">
        <button type="submit" class="small">Invalidieren</button></form></td>
    </tr>
    <tr th:if="${entries.isEmpty()}"><td colspan="10" class="muted">Keine Cache-Einträge. Cache wird pro Query aktiviert.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
