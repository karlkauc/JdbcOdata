<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, main)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · JdbcOdata'">JdbcOdata</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/webjars/codemirror/5.65.21/lib/codemirror.css}">
  <link rel="stylesheet" th:href="@{/webjars/codemirror/5.65.21/theme/eclipse.css}">
  <script th:src="@{/webjars/htmx.org/2.0.11/dist/htmx.min.js}"></script>
  <script th:src="@{/webjars/codemirror/5.65.21/lib/codemirror.js}"></script>
  <script th:src="@{/webjars/codemirror/5.65.21/mode/sql/sql.js}"></script>
  <script th:src="@{/js/admin.js}" defer></script>
</head>
<body class="app" th:attr="hx-headers='{&quot;X-CSRF-TOKEN&quot;: &quot;' + (${_csrf} != null ? ${_csrf.token} : '') + '&quot;}'">
<aside class="sidebar"><div class="sidebar-inner">
  <a class="brand" th:href="@{/admin}">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></svg></span>
    <span>JdbcOdata<small>OData feeds for Excel and Power BI</small></span>
  </a>
  <nav th:with="p=${currentPath ?: ''}" aria-label="Main navigation">
    <div class="nav-group">
      <a th:href="@{/admin}" th:classappend="${p == '/admin' or p == '/admin/'} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('home')}"></svg><span class="nav-label">Overview</span></a>
    </div>
    <div class="nav-group"><span>Data</span>
      <a th:href="@{/admin/datasources}" th:classappend="${#strings.startsWith(p, '/admin/datasources')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('database')}"></svg><span class="nav-label">Datasources</span>
        <span class="nav-dot" th:if="${nav != null and nav.datasourceProblem}" title="At least one datasource is unreachable"></span>
        <span class="nav-count" th:if="${nav != null}" th:text="${nav.datasources}">0</span></a>
      <a th:href="@{/admin/queries}" th:classappend="${#strings.startsWith(p, '/admin/queries')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('code')}"></svg><span class="nav-label">Queries</span>
        <span class="nav-dot" th:if="${nav != null and nav.queriesWithoutSnapshot > 0}"
              th:title="${nav.queriesWithoutSnapshot} + ' enabled query(s) without schema snapshot'"></span>
        <span class="nav-count" th:if="${nav != null}" th:text="${nav.queries}">0</span></a>
    </div>
    <div class="nav-group"><span>Identity</span>
      <a th:href="@{/admin/users}" th:classappend="${#strings.startsWith(p, '/admin/users') or #strings.startsWith(p, '/admin/groups')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('users')}"></svg><span class="nav-label">Service users</span>
        <span class="nav-count" th:if="${nav != null}" th:text="${nav.serviceUsers}">0</span></a>
      <a th:href="@{/admin/accounts}" th:classappend="${#strings.startsWith(p, '/admin/accounts')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('key')}"></svg><span class="nav-label">Technical accounts</span>
        <span class="nav-count" th:if="${nav != null}" th:text="${nav.accounts}">0</span></a>
    </div>
    <div class="nav-group"><span>Operations</span>
      <a th:href="@{/admin/stats}" th:classappend="${#strings.startsWith(p, '/admin/stats')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('chart')}"></svg><span class="nav-label">Statistics</span></a>
      <a th:href="@{/admin/cache}" th:classappend="${#strings.startsWith(p, '/admin/cache')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('layers')}"></svg><span class="nav-label">Cache</span></a>
      <a th:href="@{/admin/audit}" th:classappend="${#strings.startsWith(p, '/admin/audit')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('audit')}"></svg><span class="nav-label">Audit log</span></a>
    </div>
    <div class="nav-group"><span>System</span>
      <a th:href="@{/admin/admins}" th:classappend="${#strings.startsWith(p, '/admin/admins')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('shield')}"></svg><span class="nav-label">Admin accounts</span></a>
      <a th:href="@{/admin/settings}" th:classappend="${#strings.startsWith(p, '/admin/settings')} ? 'active'">
        <svg th:replace="~{fragments/icons :: icon('settings')}"></svg><span class="nav-label">Settings</span></a>
    </div>
  </nav>
  <div class="feed-quick" th:if="${serviceRoot != null}">
    <span class="feed-quick-label"><svg th:replace="~{fragments/icons :: icon('link')}"></svg>Service URL</span>
    <span class="feed-quick-row">
      <code id="nav-service-root" th:text="${serviceRoot}" th:title="${serviceRoot}">http://localhost:8080/odata/</code>
      <button type="button" class="icon-button" data-copy="#nav-service-root" title="Copy service URL" aria-label="Copy service URL">
        <svg th:replace="~{fragments/icons :: icon('copy')}"></svg></button>
    </span>
  </div>
</div></aside>
<div class="main">
  <header class="topbar">
    <nav class="crumbs" aria-label="Breadcrumb" th:with="bc=${breadcrumb}">
      <th:block th:if="${bc != null}">
        <span class="crumb-section" th:text="${bc.section}">Data</span>
        <svg th:replace="~{fragments/icons :: icon('chevron-right')}"></svg>
        <th:block th:if="${bc.parentLabel != null}">
          <a th:href="@{${bc.parentHref}}" th:text="${bc.parentLabel}">Queries</a>
          <svg th:replace="~{fragments/icons :: icon('chevron-right')}"></svg>
        </th:block>
      </th:block>
      <span class="crumb-current" th:text="${title}">Page</span>
    </nav>
    <div class="global-search" th:if="${currentUser != null}">
      <form th:action="@{/admin/search}" method="get" role="search">
        <svg th:replace="~{fragments/icons :: icon('search')}"></svg>
        <input type="search" name="q" id="global-search" placeholder="Search …" autocomplete="off" aria-label="Search"
               th:attr="hx-get=@{/admin/search}" hx-trigger="input changed delay:150ms" hx-target="#search-results" hx-swap="innerHTML">
        <kbd class="search-kbd">⌘K</kbd>
      </form>
      <div id="search-results" class="search-results" role="listbox"></div>
    </div>
    <span th:if="${environment != null and !environment.isEmpty()}" class="badge env-badge" th:classappend="${environmentTone}"
          th:text="${environment}" title="Environment (jdbcodata.ui.environment)">PROD</span>
    <details class="menu user-menu" th:if="${currentUser != null}">
      <summary><span class="avatar" th:text="${@fmt.initial(currentUser)}">A</span><span class="user-name" th:text="${currentUser}">admin</span>
        <svg th:replace="~{fragments/icons :: icon('chevron-down')}"></svg></summary>
      <div class="menu-list">
        <a th:href="@{/admin/admins}"><svg th:replace="~{fragments/icons :: icon('shield')}"></svg>Admin accounts</a>
        <a th:href="@{/admin/settings}"><svg th:replace="~{fragments/icons :: icon('settings')}"></svg>Settings</a>
        <form th:action="@{/logout}" method="post"><button type="submit"><svg th:replace="~{fragments/icons :: icon('logout')}"></svg>Sign out</button></form>
      </div>
    </details>
  </header>
  <main class="container">
    <div class="flash ok" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>
    <th:block th:replace="${main}"/>
  </main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
