# Example seed: loaded at start when jdbcodata.seed.file points to this file. Entries are upserted by name.
datasources:
  - name: erp
    description: ERP production (read-only replica)
    jdbcUrl: jdbc:oracle:thin:@//erp-db.firma.local:1521/ERPPDB
    driverClass: oracle.jdbc.OracleDriver
    timezone: Europe/Vienna
    defaultTimeoutSec: 60
    maxRows: 200000
    maxConcurrent: 5

queries:
  - name: Umsatz
    description: Umsatz je Kunde und Monat
    datasource: erp
    sql: |
      SELECT kunde, monat, betrag
      FROM v_umsatz
      WHERE jahr = :p_jahr
    parameters:
      - name: p_jahr
        type: INT
        required: true
        description: Geschaeftsjahr
    # optional: credentials used once for the schema snapshot at start (not stored)
    # snapshotCredentials: {username: report_ro, password: secret}
