# Example seed: loaded at start when jdbcodata.seed.file points to this file. Entries are upserted by name.
datasources:
  - name: erp
    description: ERP production (read-only replica)
    jdbcUrl: jdbc:oracle:thin:@//erp-db.firma.local:1521/ERPPDB
    driverClass: oracle.jdbc.OracleDriver
    timezone: Europe/Vienna
    defaultTimeoutSec: 60
    maxRows: 200000
    maxConcurrent: 5

queries:
  - name: Umsatz
    description: Umsatz je Kunde und Monat
    datasource: erp
    sql: |
      SELECT kunde, monat, betrag
      FROM v_umsatz
      WHERE jahr = :p_jahr
    parameters:
      - name: p_jahr
        type: INT
        required: true
        description: Geschaeftsjahr
    # optional: credentials used once for the schema snapshot at start (not stored)
    # snapshotCredentials: {username: report_ro, password: secret}
    # optional: key columns (sets keyMode COLUMNS semantics after the snapshot) and relations to other
    # queries, published as navigation properties in $metadata and usable with $expand and navigation paths;
    # the target query may run on another datasource (rows are joined in memory)
    # keyColumns: [PositionId]
    # relations:
    #   - name: Kunde            # navigation property name
    #     target: Kunden         # other query / entity set
    #     columns: {KundeId: KundeId}   # own column: target column
    #     toMany: false          # true = Collection(...) on the target side
    #     partner: Umsaetze      # inverse navigation on the target query, optional
