{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jdbcodata.fullname" . }}-dashboard
  labels:
    {{- include "jdbcodata.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  jdbcodata.json: |-
    {{- .Files.Get "dashboards/jdbcodata.json" | nindent 4 }}
{{- end }}
