# odata.status20.net – Schritt 1: reiner HTTP-vHost für den ersten certbot-Lauf.
# Danach durch odata.status20.net.conf (HTTP-Redirect + HTTPS-Proxy) ersetzen.
<VirtualHost *:80>
    ServerName odata.status20.net
    ServerAdmin webmaster@localhost

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1
    AllowEncodedSlashes NoDecode

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /actuator !
    ProxyPass        / http://127.0.0.1:18085/ nocanon disablereuse=On
    ProxyPassReverse / http://127.0.0.1:18085/
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Prefix early
    RequestHeader unset Forwarded early
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    ErrorLog  ${APACHE_LOG_DIR}/odata-error.log
    CustomLog ${APACHE_LOG_DIR}/odata-access.log combined
</VirtualHost>
