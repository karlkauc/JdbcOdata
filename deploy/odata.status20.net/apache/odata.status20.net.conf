# odata.status20.net – Reverse Proxy auf den JdbcOdata-Container (127.0.0.1:18085).
#
# Installation (Zertifikat zuerst mit odata.status20.net-http.conf holen):
#   sudo cp odata.status20.net-http.conf /etc/apache2/sites-available/odata.status20.net.conf
#   sudo a2ensite odata.status20.net && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot certonly --apache -d odata.status20.net -n
#   sudo cp odata.status20.net.conf /etc/apache2/sites-available/odata.status20.net.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Wichtig für OData: "nocanon" und "AllowEncodedSlashes NoDecode", damit Apache $filter, Klammern und
# prozentkodierte Zeichen in der URL unverändert weiterreicht. /actuator/ wird nicht nach außen durchgereicht.

<VirtualHost *:80>
    ServerName odata.status20.net
    ServerAdmin webmaster@localhost
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  ${APACHE_LOG_DIR}/odata-error.log
    CustomLog ${APACHE_LOG_DIR}/odata-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName odata.status20.net
    ServerAdmin webmaster@localhost
    Protocols h2 http/1.1

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/odata.status20.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/odata.status20.net/privkey.pem

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1
    AllowEncodedSlashes NoDecode
    LimitRequestBody 10485760

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600
    ProxyPass        /actuator/ !
    ProxyPass        / http://127.0.0.1:18085/ nocanon disablereuse=On
    ProxyPassReverse / http://127.0.0.1:18085/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/odata-error.log
    CustomLog ${APACHE_LOG_DIR}/odata-access.log combined
</VirtualHost>
</IfModule>
