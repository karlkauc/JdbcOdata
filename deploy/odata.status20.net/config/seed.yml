# Wird beim Start von JdbcOdata geladen (JDBCODATA_SEED_FILE=/app/config/seed.yml): legt die Datenquelle und die
# Queries an bzw. aktualisiert sie per Name. Der Schema-Snapshot wird mit excel_demo erstellt; das Passwort kommt
# aus der Container-Umgebung (DEMO_READER_PASSWORD).
datasources:
  - name: demo_postgres
    description: Demo-PostgreSQL (Container demo-db) mit Beispieldaten im Schema verkauf
    jdbcUrl: jdbc:postgresql://demo-db:5432/demo
    driverClass: org.postgresql.Driver
    timezone: Europe/Vienna
    defaultTimeoutSec: 60
    maxRows: 200000
    maxConcurrent: 8

queries:
  - name: Kunden
    description: Kundenstammdaten (Row-Level-Security in der DB entscheidet, welche Kunden ein User sieht)
    datasource: demo_postgres
    sql: |
      SELECT id AS "KundeId", name AS "Name", region AS "Region", land AS "Land",
             branche AS "Branche", kunde_seit AS "KundeSeit"
      FROM verkauf.kunden
      ORDER BY id
    keyMode: COLUMNS
    keyColumns: [KundeId]
    relations:
      - name: Umsaetze
        target: Umsatz
        columns: {KundeId: KundeId}
        toMany: true
        partner: Kunde
        description: Umsatzpositionen des Kunden
    cacheEnabled: true
    cacheTtlSec: 300
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}

  - name: Produkte
    description: Produktliste mit Kategorie und Listenpreis
    datasource: demo_postgres
    sql: |
      SELECT id AS "ProduktId", bezeichnung AS "Bezeichnung", kategorie AS "Kategorie", listenpreis AS "Listenpreis"
      FROM verkauf.produkte
      ORDER BY id
    keyMode: COLUMNS
    keyColumns: [ProduktId]
    relations:
      - name: Umsaetze
        target: Umsatz
        columns: {ProduktId: ProduktId}
        toMany: true
        partner: Produkt
        description: Umsatzpositionen mit diesem Produkt
    cacheEnabled: true
    cacheTtlSec: 300
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}

  - name: Umsatz
    description: Umsatz auf Positionsebene für ein Jahr (Parameter p_jahr)
    datasource: demo_postgres
    sql: |
      SELECT "PositionId", "BestellungId", "Bestelldatum", "Jahr", "Monat", "Status",
             "KundeId", "Kunde" AS "KundeName", "ProduktId", "Produkt" AS "ProduktName",
             "Region", "Land", "Kategorie", "Menge", "Einzelpreis", "Betrag"
      FROM verkauf.v_umsatz
      WHERE "Jahr" = :p_jahr
      ORDER BY "PositionId"
    parameters:
      - name: p_jahr
        type: INT
        required: false
        default: "2025"
        description: Geschäftsjahr
    keyMode: COLUMNS
    keyColumns: [PositionId]
    pushDown: true
    relations:
      - name: Kunde
        target: Kunden
        columns: {KundeId: KundeId}
        partner: Umsaetze
        description: Kunde der Position
      - name: Produkt
        target: Produkte
        columns: {ProduktId: ProduktId}
        partner: Umsaetze
        description: Verkauftes Produkt
    cacheEnabled: true
    cacheTtlSec: 300
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}

  - name: Bestellungen
    description: Bestellungen eines Jahres (Parameter p_jahr) mit Produktkategorien (SQL-Array), Positionen (JSON-Array) und Kundendaten (JSON-Objekt)
    datasource: demo_postgres
    sql: |
      SELECT b.id AS "BestellungId", b.bestelldatum AS "Bestelldatum", b.status AS "Status",
             b.kunde_id AS "KundeId", k.name AS "KundeName", k.region AS "Region",
             jsonb_build_object('Name', k.name, 'Land', k.land, 'Branche', k.branche, 'KundeSeit', k.kunde_seit) AS "Kundendaten",
             array_agg(DISTINCT pr.kategorie ORDER BY pr.kategorie) AS "Kategorien",
             jsonb_agg(jsonb_build_object('PositionId', p.id, 'Produkt', pr.bezeichnung, 'Menge', p.menge,
                       'Einzelpreis', p.einzelpreis, 'Betrag', p.menge * p.einzelpreis) ORDER BY p.id) AS "Positionen"
      FROM verkauf.bestellungen b
      JOIN verkauf.kunden k ON k.id = b.kunde_id
      JOIN verkauf.bestellpositionen p ON p.bestellung_id = b.id
      JOIN verkauf.produkte pr ON pr.id = p.produkt_id
      WHERE EXTRACT(YEAR FROM b.bestelldatum) = :p_jahr
      GROUP BY b.id, b.bestelldatum, b.status, b.kunde_id, k.name, k.region, k.land, k.branche, k.kunde_seit
      ORDER BY b.id
    parameters:
      - name: p_jahr
        type: INT
        required: false
        default: "2025"
        description: Geschäftsjahr
    keyMode: COLUMNS
    keyColumns: [BestellungId]
    # Kategorien wird Collection(Edm.String), Positionen eine Collection eines ComplexTypes, Kundendaten ein
    # ComplexType: $select=Positionen($filter=Betrag gt 1000;$orderby=Betrag desc;$top=3),
    # $filter=Kategorien/any(k:k eq 'Server') and Kundendaten/Land eq 'AT'; KategorienText zusätzlich als Text (Excel)
    collectionColumns: [Kategorien, Positionen, Kundendaten]
    textCopyColumns: [Kategorien]
    pushDown: true
    relations:
      - name: Kunde
        target: Kunden
        columns: {KundeId: KundeId}
        description: Kunde der Bestellung
    cacheEnabled: true
    cacheTtlSec: 300
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}

  - name: UmsatzProMonat
    description: Umsatz je Monat, Region und Kategorie für ein Jahr (Parameter p_jahr), ohne stornierte Bestellungen
    datasource: demo_postgres
    sql: |
      SELECT "Jahr", "Monat", "Region", "Kategorie",
             COUNT(DISTINCT "BestellungId") AS "Bestellungen",
             SUM("Menge")                   AS "Menge",
             SUM("Betrag")                  AS "Umsatz"
      FROM verkauf.v_umsatz
      WHERE "Jahr" = :p_jahr AND "Status" <> 'STORNIERT'
      GROUP BY "Jahr", "Monat", "Region", "Kategorie"
      ORDER BY "Jahr", "Monat", "Region", "Kategorie"
    parameters:
      - name: p_jahr
        type: INT
        required: false
        default: "2025"
        description: Geschäftsjahr
    cacheEnabled: true
    cacheTtlSec: 300
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}

  - name: Organisation
    description: Organisationseinheiten als Hierarchie (Beispiel für ancestors, descendants, traverse und $levels)
    datasource: demo_postgres
    sql: |
      SELECT "OrgId", "ParentId", "Name", "Leitung"
      FROM (VALUES
        (1, CAST(NULL AS INT), 'Geschäftsführung', 'Anna Berger'),
        (2, 1, 'Vertrieb', 'Markus Huber'),
        (3, 1, 'Technik', 'Eva Gruber'),
        (4, 1, 'Verwaltung', 'Peter Wagner'),
        (5, 2, 'Vertrieb Nord', 'Lisa Hofer'),
        (6, 2, 'Vertrieb Süd', 'Stefan Moser'),
        (7, 2, 'Key Accounts', 'Julia Steiner'),
        (8, 3, 'Entwicklung', 'Thomas Bauer'),
        (9, 3, 'Betrieb', 'Sandra Leitner'),
        (10, 8, 'Labor', 'Michael Pichler'),
        (11, 4, 'Buchhaltung', 'Claudia Fuchs'),
        (12, 4, 'Personal', 'Martin Eder')
      ) AS t("OrgId", "ParentId", "Name", "Leitung")
      ORDER BY "OrgId"
    keyMode: COLUMNS
    keyColumns: [OrgId]
    relations:
      - name: Uebergeordnet
        target: Organisation
        columns: {ParentId: OrgId}
        partner: Untergeordnet
        description: Übergeordnete Einheit (Hierarchie-Qualifier für ancestors/descendants/traverse)
      - name: Untergeordnet
        target: Organisation
        columns: {OrgId: ParentId}
        toMany: true
        partner: Uebergeordnet
        description: Direkt untergeordnete Einheiten
    pushDown: true
    cacheEnabled: true
    cacheTtlSec: 3600
    snapshotCredentials:
      username: excel_demo
      password: ${DEMO_READER_PASSWORD}
