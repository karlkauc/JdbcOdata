# Default rules plus known fixtures: the bytes 0..31 as master key, a sample delta token, a test metrics token and curl examples in the docs.
[extend]
useDefault = true

[allowlist]
description = "Fixtures and documentation examples, not secrets"
regexes = ['''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''', '''^demo:demo$''', '''^report_ro:secret$''', '''0123456789abcdef0123456789abcdef''']
paths = ['''src/test/java/at/jdbcodata/odata/DeltaLinkTest\.java''']
