site_name: JdbcOdata
site_description: Publish SQL queries from your databases as OData V4 feeds for Excel and Power BI.
site_url: https://karlkauc.github.io/JdbcOdata/
repo_url: https://github.com/karlkauc/JdbcOdata
repo_name: karlkauc/JdbcOdata
edit_uri: edit/main/website/docs/
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/database-arrow-right
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Use it:
      - Connect clients: clients.md
      - Admin guide: admin-guide.md
      - Identity model: identity.md
      - OData feature reference: odata-reference.md
  - Run it:
      - Operations: operations.md
      - Configuration reference: configuration.md
      - Database drivers: drivers.md
      - Security: security.md
  - Background:
      - Architecture: architecture.md
      - FAQ: faq.md
