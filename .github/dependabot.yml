version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Hauptversionen sind Handarbeit: Der Webjar-Test prüft nur, ob die Dateien da sind, nicht, ob sie noch passen.
    # codemirror 6.65.7 ist ein falsch nummerierter Stand von 2022, also älter als 5.65.21.
    ignore:
      - dependency-name: org.webjars.npm:codemirror
        update-types: ["version-update:semver-major"]
      - dependency-name: org.webjars.npm:htmx.org
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # Java bleibt auf 21, ein Wechsel ist Handarbeit. Digest-Updates laufen weiter.
    # Dependabot liest 3.9-eclipse-temurin-21 als 3.9.21.
    ignore:
      - dependency-name: eclipse-temurin
        versions: [">= 22"]
      - dependency-name: maven
        versions: [">= 3.9.22"]
