name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1" # new CVEs appear without a commit

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: jdbcodata:ci
      - name: Start the image and read the feed
        run: |
          docker run -d --name smoke -e SPRING_PROFILES_ACTIVE=demo -e SERVER_ADDRESS=0.0.0.0 jdbcodata:ci
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" smoke)" = healthy ]; do sleep 3; done'
          docker exec smoke sh -c 'wget -qO- --header "Authorization: Basic $(printf demo:demo | base64)" http://localhost:8080/odata/' | grep -q Sales
      - if: failure()
        run: docker logs smoke
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jdbcodata:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: The arm64 image must build too
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
